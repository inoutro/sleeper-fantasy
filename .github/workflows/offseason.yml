name: Offseason Weekly FA Report

on:
  schedule:
    - cron: '0 9 * * 1'  # 매주 월요일 오전 9시 (UTC) = 한국시간 오후 6시
  workflow_dispatch:       # 수동 실행 버튼

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offseason FA report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLEEPER_USER_ID: ${{ secrets.SLEEPER_USER_ID }}
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
          LEAGUE2_ID: ${{ secrets.LEAGUE2_ID }}
          LEAGUE2_ROSTER_ID: ${{ secrets.LEAGUE2_ROSTER_ID }}
        run: python offseason_check.py
